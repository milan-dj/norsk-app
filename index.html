<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Norsk">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Norsk · Daily Words</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header>
      <div class="brand">Norsk<em>.</em></div>
      <div class="meta" id="dateMeta">—</div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-num" id="stat-due">0</div>
        <div class="stat-label">Due</div>
      </div>
      <div class="stat">
        <div class="stat-num gold" id="stat-learning">0</div>
        <div class="stat-label">Learning</div>
      </div>
      <div class="stat">
        <div class="stat-num sage" id="stat-known">0</div>
        <div class="stat-label">Known</div>
      </div>
      <div class="stat">
        <div class="stat-num accent" id="stat-streak">0</div>
        <div class="stat-label">Streak</div>
      </div>
    </section>

    <main>
      <div class="screen active" id="screen-study">
        <div class="direction">
          <button class="dir-btn active" data-dir="no-en">Norsk → Engelsk</button>
          <button class="dir-btn" data-dir="en-no">Engelsk → Norsk</button>
        </div>

        <div id="card-container"></div>

        <div class="ratings" id="ratings">
          <button class="rate-btn rate-1" data-rate="1">
            <div class="glyph">✕</div>
            <div class="lbl">Again</div>
          </button>
          <button class="rate-btn rate-2" data-rate="2">
            <div class="glyph">~</div>
            <div class="lbl">Hard</div>
          </button>
          <button class="rate-btn rate-3" data-rate="3">
            <div class="glyph">✓</div>
            <div class="lbl">Good</div>
          </button>
          <button class="rate-btn rate-4" data-rate="4">
            <div class="glyph">✓✓</div>
            <div class="lbl">Easy</div>
          </button>
        </div>
      </div>

      <div class="screen" id="screen-browse">
        <div class="stats-heading">Words <em>—</em> <span id="browseCount">0</span></div>
        <div class="browse-filter">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="new">New</button>
          <button class="chip" data-filter="learning">Learning</button>
          <button class="chip" data-filter="known">Known</button>
        </div>
        <div class="word-list" id="wordList"></div>
      </div>

      <div class="screen" id="screen-stats">
        <div class="stats-section">
          <div class="stats-heading">Your progress <em>·</em></div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="stat-row"><span>Words seen</span><span id="prog-seen">0</span></div>
          <div class="stat-row"><span>Words known</span><span id="prog-known">0</span></div>
          <div class="stat-row"><span>Words in total</span><span id="prog-total">0</span></div>
          <div class="stat-row"><span>Reviews today</span><span id="prog-today">0</span></div>
          <div class="stat-row"><span>Current streak</span><span id="prog-streak">0 days</span></div>
          <div class="stat-row"><span>Retention</span><span id="retentionPct">0%</span></div>
        </div>

        <div class="stats-section">
          <div class="stats-heading">Hardest words <em>·</em></div>
          <div id="hardestWords"></div>
        </div>

        <div class="stats-section">
          <div class="stats-heading">Settings <em>·</em></div>
          <div class="stat-row"><span>New words per day</span><span id="daily-new">10</span></div>
          <button class="settings-btn" id="adjust-new">Adjust daily target</button>
          <button class="settings-btn danger" id="reset-progress">Reset all progress</button>
        </div>
      </div>
    </main>

    <nav>
      <button class="nav-btn active" data-screen="study">
        <div class="nav-icon">A</div>
        <div class="nav-lbl">Study</div>
      </button>
      <button class="nav-btn" data-screen="browse">
        <div class="nav-icon">≡</div>
        <div class="nav-lbl">Browse</div>
      </button>
      <button class="nav-btn" data-screen="stats">
        <div class="nav-icon">◉</div>
        <div class="nav-lbl">Stats</div>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
